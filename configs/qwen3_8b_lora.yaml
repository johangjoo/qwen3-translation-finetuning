# Extracted from archive/LoRAScript/train_qwen_lora_sec.py
# These are source-code settings, not proof of a completed historical run.
model_name: Qwen/Qwen3-8B
output_dir: outputs/qwen3-8b-lora-10ratio
data:
  train_file: data/processed/train.jsonl
  validation_file: data/processed/validation.jsonl
  sample_ratio: 0.1
quantization:
  load_in_4bit: true
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: nf4
lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM
training:
  per_device_train_batch_size: 6
  gradient_accumulation_steps: 3
  per_device_eval_batch_size: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_steps: 100
  num_train_epochs: 2
  max_steps: -1
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2
  logging_steps: 100
  optim: adamw_8bit
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  report_to: tensorboard
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  dataset_text_field: text
  max_length: 160
  packing: true
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
